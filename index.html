<!doctype html>
<html lang="es" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Registra entrenamientos de fuerza y cardio, plantillas, progreso y récords personales." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230a0a0a%22%2F%3E%3Cpath%20d%3D%22M22%2042h12v16H22zm44%200h12v16H66zM30%2034h6v32h-6zm38%200h6v32h-6zM42%2046h16v8H42z%22%20fill%3D%22%23ef4444%22%2F%3E%3C%2Fsvg%3E" />
    <title>GymTracker Pro</title>
    <script>
      // Aplica el tema antes del primer paint para evitar el flash de tema incorrecto.
      (function () {
        try {
          var saved = localStorage.getItem('gymtracker.theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.classList.remove('theme-dark', 'theme-light');
          document.documentElement.classList.add('theme-' + theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
